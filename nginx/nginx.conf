events {}

http {
    server {
        listen 80;

        location = /health {
            return 200 "nginx ok\n";
            add_header Content-Type text/plain;
        }

        location = /user-status    { proxy_pass http://user-service:5001/; }
        location = /product-status { proxy_pass http://product-service:5002/; }
        location = /order-status   { proxy_pass http://order-service:5003/; }

        location /users    { proxy_pass http://user-service:5001;    proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /products { proxy_pass http://product-service:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /orders   { proxy_pass http://order-service:5003;   proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    }
}
